name: Build AdmissionSystem

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore AdmissionSystem/AdmissionSystem.csproj

    - name: Build
      run: dotnet build AdmissionSystem/AdmissionSystem.csproj --configuration Release --no-restore

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AdmissionSystem-Build
        path: AdmissionSystem/bin/Release/net6.0-windows/
        retention-days: 30
